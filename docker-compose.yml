services:
  obsidian-plugins-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-plugins-portal
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - obsidian_plugins_portal_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true
    command: npm run dev

volumes:
  obsidian_plugins_portal_node_modules:
